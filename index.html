<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Forca Divertida · RaGuRi</title>
<style>
/* Fontes 100% do sistema — sem dependência de rede, funciona no GitHub Pages,
   file://, offline e em qualquer browser/SO */
:root {
  --font-brand: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
  --font-body:  system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
}

/* ── Reset + base ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}  /* sem scroll na tela de jogo */
body{
font-family:var(–font-body);
background:linear-gradient(145deg,#fff7ed,#fdf2f8);
display:flex;flex-direction:column;
height:100dvh;          /* dynamic viewport height — respeita barra do browser */
}

/* ── HEADER compacto ── */
.hdr{
flex-shrink:0;
display:flex;align-items:center;justify-content:space-between;
background:linear-gradient(135deg,#1a0533,#6d1fd1);
padding:6px 12px;
gap:8px;
}
.hdr-logo{height:36px;width:auto;filter:invert(1);opacity:0.9;}
.hdr-brand{font-family:var(–font-brand);font-size:1.3rem;color:#fff;letter-spacing:2px;line-height:1;}
.hdr-brand span{color:#ffd93d;}
.hdr-slogan{font-size:0.6rem;color:rgba(255,255,255,0.65);font-weight:700;letter-spacing:1px;}
.hdr-title{font-family:var(–font-brand);font-size:1.1rem;color:#fff;text-align:right;}
.hdr-btns{display:flex;gap:6px;align-items:center;}
.hdr-btn{
background:rgba(255,255,255,0.15);border:none;border-radius:10px;
color:white;font-size:0.7rem;font-weight:900;padding:4px 8px;cursor:pointer;
font-family:var(–font-body);white-space:nowrap;
}
.hdr-btn:active{opacity:0.7;}

/* ── TELA DE SETUP ── */
#setupScreen{
flex:1;overflow-y:auto;padding:10px 12px;
display:flex;flex-direction:column;gap:8px;
}
#setupScreen h2{font-family:var(–font-brand);color:#7c3aed;font-size:1.1rem;margin-bottom:2px;}
.setup-group{background:rgba(255,255,255,0.85);border-radius:16px;padding:10px 12px;}
label.lbl{display:block;font-size:0.78rem;font-weight:900;color:#5b6b85;margin-bottom:4px;}
input[type=text],input[type=number]{
width:100%;padding:9px 12px;border-radius:12px;
border:2.5px solid #d8b4fe;font-size:0.95rem;
font-family:var(–font-body);outline:none;background:white;
}
input:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,0.15);}
.setup-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.photo-row{display:flex;align-items:center;gap:10px;}
.photo-thumb{
width:52px;height:52px;border-radius:50%;border:3px solid #d8b4fe;
background:linear-gradient(135deg,#fef08a,#f9a8d4);
flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:none;}
.photo-thumb-ph{font-size:1.4rem;}
.photo-info{flex:1;}
.photo-info label.lbl{margin-bottom:2px;}
input[type=file]{font-size:0.8rem;width:100%;}
.proc-badge{font-size:0.72rem;font-weight:900;padding:2px 8px;border-radius:999px;display:none;margin-top:3px;}
.proc-badge.loading{background:#bfdbfe;color:#1e3a5f;display:inline-block;}
.proc-badge.ok{background:#bbf7d0;color:#14532d;display:inline-block;}
.proc-badge.err{background:#fecaca;color:#7f1d1d;display:inline-block;}
.btn-start{
width:100%;padding:13px;border:none;border-radius:16px;
background:linear-gradient(90deg,#34d399,#38bdf8);
color:white;font-family:var(–font-brand);font-size:1.2rem;
cursor:pointer;box-shadow:0 6px 18px rgba(52,211,153,0.3);
flex-shrink:0;
}
.btn-start:active{transform:scale(0.98);}

/* ── TELA DE JOGO ── */
#gameScreen{
flex:1;display:none;flex-direction:column;
padding:6px 8px;gap:5px;overflow:hidden;
}
#gameScreen.active{display:flex;}

/* Linha de status: erro + mensagem */
.status-row{
display:flex;align-items:center;gap:6px;flex-shrink:0;
}
.err-counter{
background:linear-gradient(90deg,#0ea5e9,#6366f1);
color:white;border-radius:10px;padding:4px 10px;
font-size:0.75rem;font-weight:900;white-space:nowrap;flex-shrink:0;
}
.msg-box{
flex:1;text-align:center;font-size:0.82rem;font-weight:900;
padding:5px 8px;border-radius:10px;
background:linear-gradient(90deg,#fef3c7,#dcfce7);color:#334155;
line-height:1.2;
}

/* Área principal: forca + palavra lado a lado */
.main-row{
display:flex;gap:8px;align-items:stretch;flex-shrink:0;
}

/* FORCA */
.hangman-wrap{
width:38vw;max-width:155px;flex-shrink:0;
background:linear-gradient(180deg,#dbeafe,#f5f3ff);
border-radius:16px;border:2.5px dashed #8b5cf6;
display:flex;align-items:center;justify-content:center;
padding:4px;
}
svg.game-svg{width:100%;height:auto;overflow:visible;}

/* PALAVRA + DICA + LETRAS USADAS */
.word-side{
flex:1;display:flex;flex-direction:column;gap:5px;min-width:0;
}
.word-display{
display:flex;flex-wrap:wrap;gap:4px;justify-content:center;
padding:4px 0;
}
.letter-slot{
min-width:28px;height:38px;border-radius:8px;
border:2.5px solid #93c5fd;background:white;
display:flex;align-items:center;justify-content:center;
font-weight:900;font-size:1.15rem;text-transform:uppercase;
}
.hint-box{
padding:5px 10px;border-radius:10px;
background:linear-gradient(135deg,#fef9c3,#fef3c7);
border:2px dashed #f59e0b;font-weight:800;color:#78350f;
font-size:0.78rem;text-align:center;display:none;
}
.hint-box.visible{display:block;}
.used-row{
display:flex;flex-wrap:wrap;gap:4px;align-items:center;
}
.used-label{font-size:0.68rem;color:#9ca3af;font-weight:900;white-space:nowrap;}
.used-chip{
background:linear-gradient(90deg,#e0e7ff,#bae6fd);
border-radius:999px;padding:2px 7px;
font-size:0.72rem;font-weight:900;
}
.hint-btn{
background:linear-gradient(90deg,#fde68a,#fbbf24);color:#78350f;
border:none;border-radius:8px;padding:3px 8px;
font-size:0.7rem;font-weight:900;cursor:pointer;
font-family:var(–font-body);flex-shrink:0;
}
.hint-btn:disabled{opacity:0.45;cursor:not-allowed;}

/* TECLADO DE LETRAS — ocupa o restante da tela */
.keyboard-wrap{
flex:1;display:flex;flex-direction:column;justify-content:center;
min-height:0;
}
.letters-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
}
.letter-btn{
aspect-ratio:1;border:none;border-radius:10px;
background:linear-gradient(180deg,#fef3c7,#fbcfe8);
color:#1e293b;font-weight:900;font-size:1rem;
cursor:pointer;font-family:var(–font-body);
text-transform:uppercase;
box-shadow:0 3px 0 rgba(0,0,0,0.12);
display:flex;align-items:center;justify-content:center;
touch-action:manipulation;
}
.letter-btn:active{transform:translateY(2px);box-shadow:none;}
.letter-btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none;background:#e5e7eb;color:#9ca3af;}

/* ── OVERLAY ERRO ── */
.erro-overlay{
position:fixed;inset:0;z-index:9999;
display:flex;align-items:center;justify-content:center;
pointer-events:none;
}
.erro-card{
display:flex;align-items:center;gap:14px;
background:linear-gradient(135deg,#fff7ed,#fef3c7);
border:4px solid #f59e0b;border-radius:28px;
padding:14px 24px 14px 14px;
box-shadow:0 0 0 6px rgba(251,191,36,0.25),0 20px 50px rgba(0,0,0,0.2);
opacity:0;transform:scale(0.3) rotate(-6deg);
max-width:88vw;
}
.erro-card.show{animation:pop 1.5s cubic-bezier(0.22,1,0.36,1) forwards;}
@keyframes pop{
0%{opacity:0;transform:scale(0.3) rotate(-6deg);}
20%{opacity:1;transform:scale(1.08) rotate(2deg);}
40%{transform:scale(0.97) rotate(-1deg);}
58%{transform:scale(1) rotate(0);opacity:1;}
82%{opacity:1;}
100%{opacity:0;transform:scale(1.04);}
}
.erro-garoto{width:80px;height:80px;border-radius:50%;overflow:hidden;border:3px solid #f59e0b;flex-shrink:0;}
.erro-garoto img{width:100%;height:100%;object-fit:cover;object-position:center top;}
.erro-texto{font-family:var(–font-brand);font-size:clamp(22px,6vw,40px);color:#92400e;line-height:1.1;}

/* ── MODAL DE FIM DE JOGO ── */
.fim-overlay{
position:fixed;inset:0;z-index:8888;
background:rgba(0,0,0,0.55);
display:none;align-items:center;justify-content:center;
}
.fim-overlay.show{display:flex;}
.fim-card{
background:white;border-radius:24px;padding:24px;
text-align:center;max-width:85vw;
box-shadow:0 20px 60px rgba(0,0,0,0.3);
}
.fim-emoji{font-size:3rem;display:block;margin-bottom:8px;}
.fim-title{font-family:var(–font-brand);font-size:1.6rem;color:#7c3aed;margin-bottom:6px;}
.fim-word{font-size:0.9rem;color:#64748b;margin-bottom:16px;font-weight:700;}
.fim-btn{
background:linear-gradient(90deg,#34d399,#38bdf8);
border:none;border-radius:14px;padding:12px 28px;
color:white;font-family:var(–font-brand);font-size:1.1rem;
cursor:pointer;
}
</style>

</head>

// ══════════════════════════════════════════════════════════════
// FOTO: DETECÇÃO + RECORTE CIRCULAR MAXIMIZADO
//
// Sem remoção de fundo. Pipeline simples e robusto:
//
//  1. detectFaceBbox(img) — analisa cor de pele (R>G, R>B, não-verde)
//     em 40 faixas horizontais + 20 colunas verticais.
//     Encontra o centróide da maior concentração de pele.
//     Funciona para qualquer posição do rosto na foto.
//
//  2. Crop QUADRADO centrado no centróide do rosto (face_size = maior
//     dimensão da bbox detectada × 1.10 de margem).
//
//  3. Desenha no workCanvas em tamanho SIZE×SIZE (quadrado).
//     Aplica clipPath circular via canvas 2D (arc + clip).
//     Resultado: JPEG circular que preenche 100% do círculo da forca.
//
//  4. applyFaceToSVG(dataURL) → pattern SVG cobre todo o círculo.
// ══════════════════════════════════════════════════════════════
//
// ESTRATÉGIA DEFINITIVA:
// 1. API Claude analisa imagem → retorna JSON com bbox do rosto
// 2. Canvas recorta EXATAMENTE aquela região
// 3. Sem remoção de fundo: o clipPath circular do SVG já faz o
//    recorte redondo. Não precisa de transparência.
// 4. Se API falhar → fallback inteligente por proporção de imagem
//
// CORREÇÕES vs versão anterior:
// - Header 'anthropic-dangerous-direct-browser-access: true' ADICIONADO
// - Verificação resp.ok antes de parsear JSON
// - Log do corpo do erro para debug
// - Regex robusto: /\{[\s\S]*?\}/ em vez de /\{[^}]+\}/
// - Fallback não depende de remoção de fundo
// ══════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════════════
// PROCESSAMENTO DE FOTO — SOLUÇÃO DEFINITIVA 100% CLIENT-SIDE
//
// PIPELINE:
//  1. detectSkinBbox(canvas)  → encontra bbox do rosto por cor de pele
//     Algoritmo: analisa pixel por pixel buscando cor de pele humana
//     (R>95, G>40, B>20, R>G, R>B, |R-G|>15, não-verde)
//     Divide em 40 faixas horizontais e 20 colunas verticais.
//     Encontra centróide da região de maior densidade de pele.
//     FUNCIONA PARA QUALQUER POSIÇÃO DO ROSTO NA FOTO.
//
//  2. removeBg(ctx, W, H, bbox) → flood-fill das bordas remove fundo
//     Usa a cor média das bordas como referência de fundo.
//     Flood-fill BFS propaga apenas por pixels similares ao fundo.
//     Feathering suave na borda (8px) para transição natural.
//     APLICADO APENAS NO RECORTE DO ROSTO = muito mais preciso.
//
//  3. applyFaceToSVG(dataURL) → atualiza pattern + fill do círculo
// ══════════════════════════════════════════════════════════════════

// ── Aplica foto ao SVG via pattern ─────────────────────────────
// O círculo da cabeça recebe fill="url(#facePattern)".
// O pattern cobre exatamente a área do círculo com a foto já recortada.
function applyFaceToSVG(dataURL) {
  const img     = document.getElementById('facePhoto');
  const circle  = document.getElementById('headCircle');
  if (!img || !circle || !dataURL) return;
  img.setAttribute('href', dataURL);
  circle.setAttribute('fill', 'url(#facePattern)');
}

function setBadge(type, text) {
  procBadge.className   = 'proc-badge ' + type;
  procBadge.textContent = text;
}

// ── Detecção do rosto por densidade de cor de pele ───────────────
// Retorna { cx, cy, size } em px da imagem original (centro + tamanho do lado).
function detectFace(imgEl) {
  const IW = imgEl.naturalWidth;
  const IH = imgEl.naturalHeight;

  // Trabalhar numa versão reduzida (max 400px) para velocidade
  const AMAX = 400;
  const sc   = Math.min(1, AMAX / Math.max(IW, IH));
  const AW   = Math.round(IW * sc);
  const AH   = Math.round(IH * sc);

  const c = document.createElement('canvas');
  c.width = AW; c.height = AH;
  const ctx = c.getContext('2d');
  ctx.drawImage(imgEl, 0, 0, AW, AH);
  const data = ctx.getImageData(0, 0, AW, AH).data;

  // Máscara de pele: cor humana sem verde (folhagem/fundo natural)
  const skin = new Uint8Array(AW * AH);
  let total  = 0;
  for (let i = 0; i < AW * AH; i++) {
    const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
    if (
      r > 95 && g > 40 && b > 20 &&
      r > g  && r > b  && (r - g) > 15 &&
      r < 250 &&               // não branco puro
      !(g > r && g > b)        // não verde (palmeiras, grama)
    ) { skin[i] = 1; total++; }
  }

  // Fallback: assume rosto no centro superior da imagem
  if (total < AW * AH * 0.005) {
    const s = Math.round(Math.min(IW, IH) * 0.65);
    return { cx: Math.round(IW / 2), cy: Math.round(IH * 0.35), size: s };
  }

  // ── Faixas horizontais: onde está a maior densidade de pele? ──
  const NH = 40;
  const rowR = new Float32Array(NH);
  for (let b = 0; b < NH; b++) {
    const y0 = Math.floor(b * AH / NH);
    const y1 = Math.floor((b+1) * AH / NH);
    let s = 0;
    for (let y = y0; y < y1; y++)
      for (let x = 0; x < AW; x++)
        s += skin[y * AW + x];
    rowR[b] = s / ((y1 - y0) * AW);
  }

  // Região contínua acima de 25% do pico
  const peakR = Math.max(...rowR);
  const thrR  = Math.max(peakR * 0.25, 0.03);
  let bStart = NH - 1, bEnd = 0;
  for (let i = 0; i < NH; i++) {
    if (rowR[i] >= thrR) { if (i < bStart) bStart = i; if (i > bEnd) bEnd = i; }
  }
  // Margem vertical: +15% para incluir testa e queixo
  const marg = Math.max(1, Math.round((bEnd - bStart) * 0.15));
  bStart = Math.max(0,    bStart - marg);
  bEnd   = Math.min(NH-1, bEnd   + marg);

  const fy0 = Math.floor(bStart * AH / NH);
  const fy1 = Math.floor((bEnd + 1) * AH / NH);

  // ── Colunas verticais: centro horizontal do rosto ──
  const NX = 20;
  const colR = new Float32Array(NX);
  for (let col = 0; col < NX; col++) {
    const x0 = Math.floor(col * AW / NX);
    const x1 = Math.floor((col+1) * AW / NX);
    let s = 0;
    for (let y = fy0; y < fy1; y++)
      for (let x = x0; x < x1; x++)
        s += skin[y * AW + x];
    colR[col] = s / ((fy1 - fy0) * (x1 - x0));
  }

  const peakC = Math.max(...colR);
  const thrC  = Math.max(peakC * 0.30, 0.03);
  let cStart = NX - 1, cEnd = 0;
  for (let i = 0; i < NX; i++) {
    if (colR[i] >= thrC) { if (i < cStart) cStart = i; if (i > cEnd) cEnd = i; }
  }
  const margX = Math.max(1, Math.round((cEnd - cStart) * 0.15));
  cStart = Math.max(0,    cStart - margX);
  cEnd   = Math.min(NX-1, cEnd   + margX);

  const fx0 = Math.floor(cStart * AW / NX);
  const fx1 = Math.floor((cEnd + 1) * AW / NX);

  // Centro e tamanho na imagem reduzida → converter para original
  const acx = (fx0 + fx1) / 2;
  const acy = (fy0 + fy1) / 2;
  const aw  = fx1 - fx0;
  const ah  = fy1 - fy0;

  const cx   = Math.round(acx / sc);
  const cy   = Math.round(acy / sc);
  const size = Math.round(Math.max(aw, ah) / sc * 1.10); // +10% de margem

  return { cx, cy, size };
}

// ── Processar foto: detectar, recortar circular, maximizar ───────
function processPhoto(imgEl) {
  setBadge('loading', '⏳ Detectando rosto...');

  // Pequeno delay para o badge aparecer antes do processamento pesado
  setTimeout(() => {
    try {
      const IW = imgEl.naturalWidth;
      const IH = imgEl.naturalHeight;

      // 1. Detectar centro e tamanho do rosto
      let { cx, cy, size } = detectFace(imgEl);

      // 2. Calcular crop quadrado centrado no rosto
      //    Garantir que não ultrapassa as bordas
      const half = Math.round(size / 2);
      let x0 = cx - half;
      let y0 = cy - half;
      let x1 = cx + half;
      let y1 = cy + half;

      // Empurrar para dentro se sair das bordas
      if (x0 < 0) { x1 -= x0; x0 = 0; }
      if (y0 < 0) { y1 -= y0; y0 = 0; }
      if (x1 > IW) { x0 -= (x1 - IW); x1 = IW; }
      if (y1 > IH) { y0 -= (y1 - IH); y1 = IH; }
      x0 = Math.max(0, x0); y0 = Math.max(0, y0);

      const cropW = x1 - x0;
      const cropH = y1 - y0;
      const cropS = Math.min(cropW, cropH); // lado final do quadrado

      // 3. Desenhar no workCanvas — tamanho SIZE×SIZE (igual ao círculo)
      //    SIZE deve ser par e suficientemente grande para qualidade.
      const SIZE = 300;
      workCanvas.width  = SIZE;
      workCanvas.height = SIZE;
      const wctx = workCanvas.getContext('2d');

      // Fundo branco (JPEG não tem transparência — círculo do SVG faz o clip)
      wctx.fillStyle = '#ffffff';
      wctx.fillRect(0, 0, SIZE, SIZE);

      // CLIP CIRCULAR: recortar em círculo no próprio canvas
      // Isso garante que a imagem final já é circular,
      // e o pattern SVG a exibe preenchendo 100% do headCircle.
      wctx.save();
      wctx.beginPath();
      wctx.arc(SIZE / 2, SIZE / 2, SIZE / 2, 0, Math.PI * 2);
      wctx.clip();

      // Desenhar o crop da foto centralizado e escalado para preencher o círculo
      // Usar o cropS (quadrado) para mapear exatamente no círculo SIZE×SIZE
      const srcX = x0 + (cropW - cropS) / 2;
      const srcY = y0 + (cropH - cropS) / 2;
      wctx.drawImage(imgEl, srcX, srcY, cropS, cropS, 0, 0, SIZE, SIZE);
      wctx.restore();

      // 4. Exportar como PNG (transparência fora do círculo)
      const dataURL = workCanvas.toDataURL('image/png');

      // 5. Preview circular no painel de config
      previewImg.src = dataURL;
      previewImg.style.display = 'block';
      photoPlaceholder.style.display = 'none';

      // 6. Aplicar ao SVG da forca
      faceURL = dataURL;
      applyFaceToSVG(dataURL);

      setBadge('ok', '✅ Rosto detectado!');

    } catch (err) {
      console.error('[processPhoto]', err);
      setBadge('err', '❌ Erro: ' + err.message);
    }
  }, 30);
}

// ── Carregar foto ────────────────────────────────────────────────
photoInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  setBadge('loading', '⏳ Carregando...');
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload  = () => processPhoto(img);
    img.onerror = () => setBadge('err', '❌ Erro ao carregar imagem');
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// ── Animação do card de erro ─────────────────────────────────
function showErroAnim() {
  try {
    if (erroTimeout) clearTimeout(erroTimeout);
    erroCard.classList.remove('show');
    void erroCard.offsetWidth;
    erroCard.classList.add('show');
    erroTimeout = setTimeout(() => erroCard.classList.remove('show'), 1700);
  } catch(e) {}
}

// ── Utilitários ──────────────────────────────────────────────
function norm(t) { return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase(); }
function shuffle(a) { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }
function uniq(w) { const s=new Set(); for(const c of w) if(/[A-Z]/.test(c)) s.add(c); return[...s]; }

function pickRevealed() {
  const pos=[];
  for(let i=0;i<normWord.length;i++) if(/[A-Z]/.test(normWord[i])) pos.push(i);
  const n=Math.max(0,Math.min(Number(revealedCountInput.value||0),pos.length));
  shuffle(pos);
  revealed=new Set(pos.slice(0,n));
  for(const i of revealed) guessed.add(normWord[i]);
}

function buildLetters() {
  const wl=uniq(normWord);
  const pool=ALPHA.split('').filter(c=>!wl.includes(c));
  shuffle(pool);
  const opts=shuffle([...wl,...pool.slice(0,Math.max(8,18-wl.length))]);
  lettersGrid.innerHTML='';
  opts.forEach(l=>{
    const b=document.createElement('button');
    b.className='letter-btn'; b.textContent=l; b.type='button';
    b.onclick=()=>guess(l,b);
    lettersGrid.appendChild(b);
  });
}

function renderWord() {
  wordDisplay.innerHTML='';
  for(let i=0;i<secretWord.length;i++){
    const oc=secretWord[i], nc=normWord[i];
    const s=document.createElement('div');
    s.className='letter-slot';
    if(oc===' '){Object.assign(s.style,{visibility:'hidden',minWidth:'18px',border:'none',background:'transparent',boxShadow:'none'});}
    else if(guessed.has(nc)||revealed.has(i)){s.textContent=oc.toUpperCase();}
    else{s.textContent='_';}
    wordDisplay.appendChild(s);
  }
}

function renderUsed() {
  usedList.innerHTML='';
  const all=[...new Set([...guessed,...wrong])].sort();
  if(!all.length){const c=document.createElement('div');c.className='used-chip';c.textContent='Nenhuma ainda';usedList.appendChild(c);return;}
  all.forEach(l=>{const c=document.createElement('div');c.className='used-chip';c.textContent=l;usedList.appendChild(c);});
}

function stats() {
  if(chancesPill) chancesPill.textContent = 'Erros: ' + wrong.size + '/' + MAX_ERR;
  let tot=0,done=0;
  for(let i=0;i<normWord.length;i++){
    if(/[A-Z]/.test(normWord[i])){tot++;if(guessed.has(normWord[i])||revealed.has(i))done++;}
  }
}


function hangman() {
  for(let i=1;i<=MAX_ERR;i++)
    document.getElementById('part'+i).style.display=wrong.size>=i?'block':'none';
  // Sempre manter a foto no SVG se existir
  if(faceURL) applyFaceToSVG(faceURL);
}

function disableAll() { document.querySelectorAll('.letter-btn').forEach(b=>b.disabled=true); }

function msg(t){ if(messageBox) messageBox.innerHTML = t; }
function solved() {
  for(let i=0;i<normWord.length;i++){
    const c=normWord[i];
    if(/[A-Z]/.test(c)&&!guessed.has(c)&&!revealed.has(i)) return false;
  }
  return true;
}

// ════════════════════════════════════════════════════════════
// SISTEMA DE ÁUDIO — AudioContext global único
//
// PROBLEMA RAIZ: cada new AudioContext() começa suspended no iOS/Chrome.
// O tone() funcionava porque usava osc.start(currentTime=0) e o som
// tocava ao ser resumed. O hino agendava notas em T0+offset, mas
// quando o resume acontecia, currentTime avançava e as notas ficavam
// no passado — silêncio total.
//
// SOLUÇÃO DEFINITIVA: um único AudioContext criado e resumido no
// PRIMEIRO clique do usuário. Após isso fica em estado "running"
// para sempre. Todos os sons reutilizam este mesmo contexto.
// ════════════════════════════════════════════════════════════
let gCtx = null;

function getCtx() {
  if (!gCtx || gCtx.state === 'closed') {
    const ACtx = window.AudioContext || window.webkitAudioContext;
    if (!ACtx) return null;
    gCtx = new ACtx();
  }
  // Se suspended, resume sincronicamente (o clique do usuário permite isso)
  if (gCtx.state === 'suspended') gCtx.resume();
  return gCtx;
}

// Inicializar o contexto no PRIMEIRO toque/clique — antes de qualquer som
function initAudio() {
  getCtx(); // cria e resume o contexto uma vez
}
document.addEventListener('touchstart', initAudio, { once: true, passive: true });
document.addEventListener('click',      initAudio, { once: true });

// ── Efeitos sonoros ──────────────────────────────────────────
function tone(type) {
  if (!soundOn) return;
  const ctx = getCtx(); if (!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const g   = ctx.createGain();
  osc.connect(g); g.connect(ctx.destination);
  const map = {
    good:  [[523.25,0],[659.25,.12],[783.99,.24]],
    bad:   [[260,0],[180,.22]],
    win:   [[523.25,0],[659.25,.1],[783.99,.2],[1046.5,.35]],
    lose:  [[220,0],[196,.18],[164.81,.36]],
    hint:  [[880,0],[660,.15]],
    click: [[440,0]]
  };
  (map[type] || map.click).forEach(([f,t]) =>
    osc.frequency.linearRampToValueAtTime(f, now + t)
  );
  osc.type = (type === 'bad' || type === 'lose') ? 'square' : 'triangle';
  g.gain.setValueAtTime(.0001, now);
  g.gain.linearRampToValueAtTime(.08, now + .01);
  g.gain.exponentialRampToValueAtTime(.0001, now + .45);
  osc.start(now);
  osc.stop(now + .46);
}

// ── Música de fundo ──────────────────────────────────────────
function startBg() {
  if (!soundOn) return;
  stopBg();
  const notes = [392, 440, 523.25, 587.33, 659.25];
  let idx = 0;
  bgInterval = setInterval(() => {
    if (!soundOn) return;
    const ctx = getCtx(); if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g   = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.frequency.value = notes[idx++ % notes.length];
    osc.type = 'sine';
    g.gain.setValueAtTime(.0001, now);
    g.gain.linearRampToValueAtTime(.016, now + .03);
    g.gain.exponentialRampToValueAtTime(.0001, now + .35);
    osc.start(now);
    osc.stop(now + .36);
  }, 1200);
}
function stopBg() { if (bgInterval) { clearInterval(bgInterval); bgInterval = null; } }

// ── Voz infantil (fallback Web Audio) ───────────────────────
function _kidVoiceAudio() {
  if (!soundOn) return;
  const ctx = getCtx(); if (!ctx) return;
  const sylls = [
    [275, 0.13, 0.02],
    [285, 0.11, 0.03],
    [268, 0.12, 0.02],
    [278, 0.11, 0.03],
    [315, 0.24, 0.00],
  ];
  let t = ctx.currentTime + 0.05;
  sylls.forEach(([f0, dur, gap]) => {
    const osc  = ctx.createOscillator();
    const filt = ctx.createBiquadFilter();
    const env  = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(f0, t);
    filt.type = 'bandpass'; filt.frequency.value = 1000; filt.Q.value = 1.5;
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(0.18, t + 0.012);
    env.gain.setValueAtTime(0.16, t + dur * 0.65);
    env.gain.linearRampToValueAtTime(0, t + dur);
    osc.connect(filt); filt.connect(env); env.connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.01);
    t += dur + gap;
  });
}

// ── Voz infantil masculina "Tente outra vez!" ────────────────
// Estratégia:
//   1. Tenta Web Speech API com workaround para iOS/Safari
//      (o erro assíncrono é capturado no utterance.onerror)
//   2. Fallback: Web Audio com síntese de formantes vocais
//
// O erro anterior vinha de chamar speechSynthesis.speak() globalmente.
// Agora cada utterance tem onerror que absorve falhas silenciosamente.
function playKidVoice() {
  if (!soundOn) return;

  // ── Tentativa 1: Web Speech API ───────────────────────────
  if (window.speechSynthesis) {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance('Tente outra vez!');
      u.lang   = 'pt-BR';
      u.volume = 1;
      u.rate   = 0.75;   // mais lento = mais dramático
      u.pitch  = 1.8;    // alto = voz aguda de criança

      // Captura erros assíncronos — ESSENCIAL para iOS/Safari externo
      u.onerror = () => _kidVoiceAudio();

      // Selecionar voz pt-BR se disponível
      const voices = window.speechSynthesis.getVoices();
      if (voices.length) {
        const ptVoice = voices.find(v => v.lang === 'pt-BR')
                     || voices.find(v => v.lang.startsWith('pt'));
        if (ptVoice) u.voice = ptVoice;
      }

      window.speechSynthesis.speak(u);

      // Watchdog: se após 600ms não tocou nada, usa fallback de áudio
      // (acontece em browsers que têm a API mas não carregaram vozes)
      const watchdog = setTimeout(() => {
        if (window.speechSynthesis.speaking) return; // está falando, OK
        _kidVoiceAudio();
      }, 600);

      u.onend = () => clearTimeout(watchdog);

    } catch(e) {
      _kidVoiceAudio(); // fallback imediato se a API não existir
    }
    return;
  }

  // ── Sem Speech API: vai direto ao áudio ───────────────────
  _kidVoiceAudio();
}


// ── Fanfarra de vitória ──────────────────────────────────────
// Toca um arquivo WAV embutido em base64 via elemento <audio>.
// Esta abordagem é 100% confiável em todos os browsers (iOS, Android,
// desktop) e não depende de Web Audio API timing.
function playHinoBahia() {
  if (!soundOn) return;
  try {
    const audio = document.getElementById('winAudio');
    if (!audio) return;
    audio.currentTime = 0;
    audio.volume = 0.85;
    // play() retorna Promise — pode falhar se autoplay bloqueado,
    // mas como é chamada após clique do usuário (acerto da letra),
    // está dentro do user gesture chain e funciona.
    const p = audio.play();
    if (p && p.catch) p.catch(err => console.warn('audio play:', err));
  } catch(e) {
    console.warn('playHinoBahia:', e);
  }
}

// ── Melodia de decepção ──────────────────────────────────────
// Toca ao perder o jogo (todas as 6 tentativas erradas).
// Toca o WAV via elemento <audio>. Para qualquer outro áudio antes
// e usa um pequeno delay para garantir que o AudioContext de outros
// sons não interfira.
function playDecepcao() {
  if (!soundOn) return;
  try {
    const audio = document.getElementById('loseAudio');
    if (!audio) { console.warn('loseAudio element not found'); return; }

    // Para qualquer outro som
    const winAudio = document.getElementById('winAudio');
    if (winAudio) { try { winAudio.pause(); winAudio.currentTime = 0; } catch(e){} }

    audio.pause();
    audio.currentTime = 0;
    audio.volume = 0.9;
    audio.muted = false;

    const p = audio.play();
    if (p && p.catch) {
      p.catch(err => {
        console.warn('decepcao play error (1ª tentativa):', err);
        // Fallback: tentar tocar novamente após pequeno delay
        setTimeout(() => {
          try { audio.currentTime = 0; audio.play(); }
          catch(e) { console.warn('decepcao retry falhou:', e); }
        }, 100);
      });
    }
  } catch(e) {
    console.warn('playDecepcao:', e);
  }
}


// ── Lógica do jogo ───────────────────────────────────────────
function guess(letter, btn) {
  if(!gameOn||guessed.has(letter)||wrong.has(letter)) return;
  btn.disabled=true;
  try {
    if(normWord.includes(letter)){
      guessed.add(letter);
      tone('good');
      msg('✨ Boa! A letra <strong>' + letter + '</strong> está na palavra!');
    } else {
      wrong.add(letter);
      const isFatalError = (wrong.size >= MAX_ERR);
      showErroAnim();
      if (!isFatalError) {
        // Só toca voz de criança e som de erro se NÃO for o último erro
        // (evita sobrepor a melodia de decepção)
        playKidVoice();
        tone('bad');
        msg('😅 A letra <strong>' + letter + '</strong> não está aqui... Tente outra vez!');
      } else {
        msg('😢 Que pena! A palavra era <strong>' + word + '</strong>.');
      }
    }
    renderWord(); renderUsed(); stats(); hangman(); check();
  } catch(e) {
    console.error('guess error:', e);
  }
}

function revealAll() { for(const c of uniq(normWord)) guessed.add(c); renderWord(); stats(); }

function check() {
  if(solved()){
    gameOn=false; disableAll(); stopBg();
    playHinoBahia();                        // 🎵 hino do Bahia!
    setTimeout(()=>showFim(true), 800);
    return;
  }
  if(wrong.size>=MAX_ERR){
    // Tocar melodia PRIMEIRO, ainda dentro do user gesture do clique
    playDecepcao();                          // 🎵 melodia de decepção
    gameOn=false; disableAll(); revealAll(); stopBg();
    setTimeout(()=>showFim(false), 1800);   // espera melodia tocar antes do modal
  }
}

function reset() {
  guessed=new Set(); wrong=new Set(); revealed=new Set();
  gameOn=false;
  lettersGrid.innerHTML=''; usedList.innerHTML=''; wordDisplay.innerHTML='';
  hintBox.classList.remove('visible'); hintText.textContent='';
  hintBtn.disabled=true; hintBtn.textContent='💡 Ver dica';
  msg('Preencha a palavra secreta e clique em <strong>Iniciar jogo</strong>.');
  stats(); hangman();
}

function start() {
  const raw=secretWordInput.value.trim();
  if(!raw){msg('⚠️ Digite uma palavra secreta para começar.');tone('bad');return;}
  secretWord=raw; normWord=norm(raw);
  guessed=new Set(); wrong=new Set(); revealed=new Set();
  gameOn=true;
  currentHint=hintInput.value.trim();
  hintBox.classList.remove('visible'); hintText.textContent='';
  hintBtn.disabled=!currentHint; hintBtn.textContent=currentHint?'💡 Ver dica':'💡 Sem dica';
  // Garantir foto no SVG se já carregada
  if(faceURL) applyFaceToSVG(faceURL);
  pickRevealed(); buildLetters();
  renderWord(); renderUsed(); stats(); hangman();
  msg('🎯 Jogo iniciado! Escolha uma letra!');
  tone('click'); startBg();
  secretWordInput.value='';
  document.getElementById('setupScreen').style.display = 'none';
  const gs = document.getElementById('gameScreen');
  gs.style.display = 'flex';
  gs.classList.add('active');
  document.getElementById('setupBtn').style.display = 'inline-block';
}

hintBtn.addEventListener('click',()=>{ if(!currentHint)return; hintText.textContent=currentHint; hintBox.classList.add('visible'); hintBtn.disabled=true; hintBtn.textContent='💡 Dica revelada'; tone('hint'); });
startBtn.addEventListener('click', start);
// replayBtn substituído por novoJogo() no modal
musicBtn.addEventListener('click',()=>{
  soundOn=!soundOn;
  musicBtn.textContent=soundOn?'🔊':'🔇';
  if(!soundOn){ stopBg(); }
  else if(gameOn){startBg();tone('click');}
});

reset();



// ── Tela de setup ───────────────────────────────────────────
function showSetup() {
  document.getElementById('setupScreen').style.display = 'flex';
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('gameScreen').style.display = 'none';
}

// ── Modal de fim de jogo ─────────────────────────────────────
function showFim(win) {
  const overlay = document.getElementById('fimOverlay');
  document.getElementById('fimEmoji').textContent  = win ? '🏆' : '😢';
  document.getElementById('fimTitle').textContent  = win ? 'Você acertou!' : 'Fim de jogo!';
  document.getElementById('fimWord').textContent   = win ? '' : 'A palavra era: ' + secretWord.toUpperCase();
  overlay.classList.add('show');
}

// ── Novo jogo ────────────────────────────────────────────────
function novoJogo() {
  document.getElementById('fimOverlay').classList.remove('show');
  showSetup();
  reset();
  stopBg();
  tone('click');
}
